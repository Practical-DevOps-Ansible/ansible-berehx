---
- name: Setup MariaDB and Laravel
  hosts: all
  become: yes
  tasks:
    - name: Install System Packages
      apt:
        name: [mariadb-server, python3-mysqldb, apache2, php, libapache2-mod-php, php-mysql, php-xml, php-curl, php-mbstring, php-zip, php-bcmath, git, curl, unzip]
        state: present
        update_cache: yes

    - name: Start Services
      service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop: [mariadb, apache2]

    - name: Database Setup
      mysql_db:
        name: lrv
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Database User with Native Password
      mysql_user:
        name: lrv
        password: password123
        priv: "lrv.*:ALL"
        host: "localhost"
        state: present
        plugin: mysql_native_password
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Install Composer CLI
      shell: curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      args:
        creates: /usr/local/bin/composer

    - name: Clone Repository
      git:
        repo: 'https://github.com/Practical-DevOps/app-for-devops.git'
        dest: /var/www/laravel-app
        force: yes

    - name: Ownership Fix
      file:
        path: /var/www/laravel-app
        owner: www-data
        group: www-data
        recurse: yes

    - name: Prepare .env
      become_user: www-data
      copy:
        src: /var/www/laravel-app/.env.example
        dest: /var/www/laravel-app/.env
        remote_src: yes

    - name: Update .env Config
      lineinfile:
        path: /var/www/laravel-app/.env
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^DB_HOST=', line: 'DB_HOST=127.0.0.1' }
        - { regexp: '^DB_DATABASE=', line: 'DB_DATABASE=lrv' }
        - { regexp: '^DB_USERNAME=', line: 'DB_USERNAME=lrv' }
        - { regexp: '^DB_PASSWORD=', line: 'DB_PASSWORD=password123' }
        - { regexp: '^APP_URL=', line: 'APP_URL=http://localhost' }
        - { regexp: '^SESSION_DRIVER=', line: 'SESSION_DRIVER=file' }

    - name: Composer Install
      become_user: www-data
      shell: composer install --no-interaction --no-dev
      args:
        chdir: /var/www/laravel-app
      environment:
        HOME: /tmp

    - name: Laravel Setup
      become_user: www-data
      shell: |
        php artisan key:generate --force
        php artisan migrate:fresh --seed --force
        php artisan cache:clear
        php artisan config:clear
      args:
        chdir: /var/www/laravel-app

    - name: Final Permissions
      file:
        path: "{{ item }}"
        owner: www-data
        group: www-data
        mode: '0777'
        state: directory
        recurse: yes
      loop:
        - /var/www/laravel-app/storage
        - /var/www/laravel-app/bootstrap/cache

    - name: VirtualHost Config
      copy:
        dest: /etc/apache2/sites-available/000-default.conf
        content: |
          <VirtualHost *:80>
              DocumentRoot /var/www/laravel-app/public
              <Directory /var/www/laravel-app/public>
                  AllowOverride All
                  Require all granted
              </Directory>
          </VirtualHost>

    - name: Restart Apache
      shell: |
        a2enmod rewrite
        systemctl restart apache2
