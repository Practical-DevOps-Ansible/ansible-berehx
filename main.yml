---
- name: Setup MariaDB Server
  hosts: db
  become: yes
  tasks:
    - name: Install MariaDB and Python support
      apt:
        name: [mariadb-server, python3-mysqldb]
        state: present
        update_cache: yes

    - name: Ensure MariaDB is running
      service:
        name: mariadb
        state: started
        enabled: yes

    - name: Create Database
      mysql_db:
        name: "{{ db_name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create DB User (Multiple Hosts)
      mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_pass }}"
        priv: "{{ db_name }}.*:ALL"
        host: "{{ item }}"
        state: present
        plugin: mysql_native_password
        login_unix_socket: /var/run/mysqld/mysqld.sock
      loop: ['%', 'localhost', '127.0.0.1']

    - name: Allow Remote Connections
      lineinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
      notify: Restart MariaDB

  handlers:
    - name: Restart MariaDB
      service:
        name: mariadb
        state: restarted

- name: Setup Apache and Laravel App
  hosts: server
  become: yes
  tasks:
    - name: Install Dependencies
      apt:
        name: [apache2, php, libapache2-mod-php, php-mysql, php-xml, php-curl, php-mbstring, php-zip, git, curl, unzip]
        state: present
        update_cache: yes

    - name: Install Composer
      shell: curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      args:
        creates: /usr/local/bin/composer

    - name: Clone Repository
      git:
        repo: 'https://github.com/Practical-DevOps/app-for-devops.git'
        dest: /var/www/laravel-app
        force: yes

    - name: Set Project Ownership
      file:
        path: /var/www/laravel-app
        owner: www-data
        group: www-data
        recurse: yes

    - name: Configure .env
      copy:
        src: /var/www/laravel-app/.env.example
        dest: /var/www/laravel-app/.env
        remote_src: yes
        owner: www-data
        group: www-data

    - name: Update .env settings
      lineinfile:
        path: /var/www/laravel-app/.env
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^DB_CONNECTION=', line: 'DB_CONNECTION=mysql' }
        - { regexp: '^DB_HOST=', line: 'DB_HOST=127.0.0.1' }
        - { regexp: '^DB_PORT=', line: 'DB_PORT=3306' }
        - { regexp: '^DB_DATABASE=', line: 'DB_DATABASE={{ db_name }}' }
        - { regexp: '^DB_USERNAME=', line: 'DB_USERNAME={{ db_user }}' }
        - { regexp: '^DB_PASSWORD=', line: 'DB_PASSWORD={{ db_pass }}' }

    - name: Install Composer Dependencies
      shell: composer install --no-interaction --no-dev
      args:
        chdir: /var/www/laravel-app
      become: yes
      become_user: www-data
      environment:
        HOME: /tmp

    - name: Generate App Key
      shell: php artisan key:generate --force
      args:
        chdir: /var/www/laravel-app
      become: yes
      become_user: www-data

    - name: Run Database Migrations
      shell: php artisan migrate --force
      args:
        chdir: /var/www/laravel-app
      become: yes
      become_user: www-data

    - name: Fix storage permissions
      file:
        path: /var/www/laravel-app/storage
        mode: '0777'
        recurse: yes

    - name: Configure Apache VirtualHost
      copy:
        dest: /etc/apache2/sites-available/laravel.conf
        content: |
          <VirtualHost *:80>
              DocumentRoot /var/www/laravel-app/public
              <Directory /var/www/laravel-app/public>
                  AllowOverride All
                  Require all granted
              </Directory>
          </VirtualHost>

    - name: Enable Site and Rewrite
      shell: |
        a2enmod rewrite
        a2ensite laravel.conf
        a2dissite 000-default.conf
      notify: Restart Apache

  handlers:
    - name: Restart Apache
      service:
        name: apache2
        state: restarted
