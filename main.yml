---
- name: Setup MariaDB and Laravel
  hosts: all
  become: yes
  tasks:
    - name: Install System Packages
      apt:
        name: [mariadb-server, python3-mysqldb, apache2, php, libapache2-mod-php, php-mysql, php-xml, php-curl, php-mbstring, php-zip, git, curl, unzip]
        state: present
        update_cache: yes

    - name: Create Ansible tmp directory
      file:
        path: /tmp/.ansible/tmp
        state: directory
        mode: '1777'

    - name: Services Start
      service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop: [mariadb, apache2]

    - name: DB Setup
      mysql_db:
        name: "{{ db_name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: DB User Setup
      mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_pass }}"
        priv: "{{ db_name }}.*:ALL"
        host: "localhost"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Install Composer
      shell: curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      args:
        creates: /usr/local/bin/composer

    - name: Clone App
      git:
        repo: 'https://github.com/Practical-DevOps/app-for-devops.git'
        dest: /var/www/laravel-app
        force: yes

    - name: Fix ownership before composer
      file:
        path: /var/www/laravel-app
        owner: www-data
        group: www-data
        recurse: yes

    - name: Configure .env
      become_user: www-data
      shell: cp .env.example .env
      args:
        chdir: /var/www/laravel-app
        creates: /var/www/laravel-app/.env

    - name: Update .env DB Settings
      lineinfile:
        path: /var/www/laravel-app/.env
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^DB_HOST=', line: 'DB_HOST=127.0.0.1' }
        - { regexp: '^DB_DATABASE=', line: 'DB_DATABASE={{ db_name }}' }
        - { regexp: '^DB_USERNAME=', line: 'DB_USERNAME={{ db_user }}' }
        - { regexp: '^DB_PASSWORD=', line: 'DB_PASSWORD={{ db_pass }}' }

    - name: Install PHP Dependencies
      become_user: www-data
      shell: composer install --no-interaction --no-dev
      args:
        chdir: /var/www/laravel-app
      environment:
        HOME: /tmp

    - name: Laravel Prep
      become_user: www-data
      shell: |
        php artisan key:generate --force
        php artisan migrate --force
      args:
        chdir: /var/www/laravel-app

    - name: Fix Permissions
      file:
        path: "{{ item }}"
        owner: www-data
        group: www-data
        mode: '0775'
        state: directory
        recurse: yes
      loop:
        - /var/www/laravel-app/storage
        - /var/www/laravel-app/bootstrap/cache

    - name: Apache Config
      copy:
        dest: /etc/apache2/sites-available/000-default.conf
        content: |
          <VirtualHost *:80>
              DocumentRoot /var/www/laravel-app/public
              <Directory /var/www/laravel-app/public>
                  AllowOverride All
                  Require all granted
              </Directory>
          </VirtualHost>

    - name: Apache Finalize
      shell: |
        a2enmod rewrite
        systemctl restart apache2
